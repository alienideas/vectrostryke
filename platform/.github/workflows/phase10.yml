name: phase10-future-proof

on:
  push:
    paths:
      - "platform/phase10/**"
      - "platform/decision_core/**"
  pull_request:
    paths:
      - "platform/phase10/**"

jobs:
  phase10-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 platform/phase10/tests/test_phase10.py
