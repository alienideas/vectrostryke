name: phase9-control-plane

on:
  push:
    paths:
      - "platform/phase9/**"
      - "platform/phase4/**"
  pull_request:
    paths:
      - "platform/phase9/**"
      - "platform/phase4/**"

jobs:
  phase9-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 platform/phase9/tests/test_phase9.py
