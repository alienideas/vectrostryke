name: asg

on:
  push:
    paths: ["AS/**", "platform/phase8/**", "platform/decision_core/**"]
  pull_request:
    paths: ["AS/**"]

jobs:
  asg-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 AS/tests/test_asg.py
