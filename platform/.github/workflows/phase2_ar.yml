name: phase2-ar-linux

on:
  push:
    paths:
      - "AR/Linux/phase2/**"
      - "platform/decision_core/**"
      - "platform/shared/contracts/**"
  pull_request:
    paths:
      - "AR/Linux/phase2/**"
      - "platform/decision_core/**"
      - "platform/shared/contracts/**"

jobs:
  phase2-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 platform/shared/contracts/tests/test_contracts.py
      - run: python3 platform/decision_core/tests/test_decision_core.py
      - run: python3 AR/Linux/phase2/tests/test_phase2_e2e.py
