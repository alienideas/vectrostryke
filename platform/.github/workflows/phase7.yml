name: phase7-playbooks-export

on:
  push:
    paths:
      - "platform/phase7/**"
      - "platform/phase4/**"
      - "platform/decision_core/**"
  pull_request:
    paths:
      - "platform/phase7/**"

jobs:
  phase7-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 platform/phase7/tests/test_phase7.py
