name: decision-core

on:
  push:
    paths:
      - "platform/decision_core/**"
      - "platform/shared/contracts/**"
  pull_request:
    paths:
      - "platform/decision_core/**"
      - "platform/shared/contracts/**"

jobs:
  decision-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase 0 contracts
        run: python3 platform/shared/contracts/tests/test_contracts.py
      - name: Phase 1 decision core
        run: python3 platform/decision_core/tests/test_decision_core.py
