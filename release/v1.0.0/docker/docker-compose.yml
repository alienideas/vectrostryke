# VectorStryke v1.0.0 — reference production compose (Linux)
version: "3.8"
services:
  asg:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../../AS:/app/AS:ro
      - ../configs/asg.production.json:/etc/vectorstryke/asg.production.json:ro
      - asg-data:/app/AS/data
    command: >
      python3 /app/AS/linux/asg/adapters/http_server.py
      --config /etc/vectorstryke/asg.production.json
      --root /app/AS
      --host 0.0.0.0
      --port 8787
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  asg-data:
