name: VectorStryke Engine CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVS_ENGINE_BUILD_TESTS=ON
          cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  linux-clang:
    name: Linux · Clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: Configure & build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DVS_ENGINE_BUILD_TESTS=ON
          cmake --build build -j
      - working-directory: build
        run: ctest --output-on-failure

  windows:
    name: Windows · MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVS_ENGINE_BUILD_TESTS=ON
          cmake --build build --config Release -j
      - name: Test
        shell: pwsh
        run: |
          cd build
          ctest -C Release --output-on-failure

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [linux, linux-clang, windows]
    steps:
      - run: echo "VectorStrykeEngine CI passed"
